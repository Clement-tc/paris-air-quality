services:
  - type: web
    name: paris-air-quality-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: OPENAQ_API_KEY
        sync: false # set manually in the Render dashboard — get a free key at https://explore.openaq.org
      - key: FRONTEND_ORIGINS
        value: "*" # tighten to your Vercel URL after the frontend is deployed
